<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Workflow 本地控制台</title><style>
:root{color-scheme:light;--ink:#172638;--muted:#657589;--line:#d8e1eb;--blue:#1565a8;--bluebg:#edf6fd;--orange:#bc5c18;--orangebg:#fff4e9;--green:#287248;--paper:#f4f7fa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:22px max(22px,calc((100vw - 1320px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:22px;margin:0}header p{color:var(--muted);margin:4px 0 0}.wrap{max-width:1320px;margin:22px auto;padding:0 20px}.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.5fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;min-width:0}.card h2{font-size:17px;margin:0 0 14px}.input{background:var(--bluebg);border-color:#a8cce7;color:#123f63}.output{background:var(--orangebg);border-color:#f1c49e;color:#713809}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:7px;background:var(--blue);color:#fff;padding:9px 13px;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#e7eef5;color:#24384d}button.warn{background:var(--orange)}button:disabled{opacity:.5;cursor:wait}input,select,textarea{font:inherit;padding:8px;border:1px solid #aecbe0;border-radius:6px;background:#f7fbff;color:#18344c}input[type=text]{min-width:160px;flex:1}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}.repo{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:12px}.repo strong{color:#164e7a}.dim{color:var(--muted);font-size:13px}.edge{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:9px 0}.edge button{padding:5px 9px}.case{border-left:4px solid var(--orange);padding:10px 12px;background:#fffaf5;margin:9px 0;border-radius:5px}.case h3{margin:0;font-size:15px}.case p{margin:4px 0;color:var(--muted);font-size:13px}.status{color:var(--orange);font-weight:700}.scroll{max-height:490px;overflow:auto}.notice{padding:10px;border-radius:6px;background:#eef3f8;margin:10px 0;white-space:pre-wrap}.error{background:#fff0ed;color:#922d17}iframe{width:100%;height:640px;border:1px solid var(--line);border-radius:8px;background:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.wide{grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{align-items:flex-start;flex-direction:column}.edge{grid-template-columns:1fr auto auto}.edge button:last-child{grid-column:2/4}}
#repos,#edges{max-height:340px;overflow:auto;padding-right:6px}#verification{max-height:400px;overflow:auto;padding-right:6px}.toolbar button:focus-visible,input:focus-visible{outline:3px solid #75add8;outline-offset:3px}.dim,.repo{overflow-wrap:anywhere}@media(max-width:520px){.row input{width:100%;min-width:0}.wrap{padding:0 12px}.card{padding:14px}header{padding:18px 14px}}
</style></head><body><header><div><h1>Robot Workflow · 本地工程台</h1><p>工作区：<b id="root">__ROOT__</b>　·　发现、审阅、验证与变更跟踪</p></div><div class="toolbar"><button class="secondary" onclick="loadState()">刷新界面</button><button onclick="refreshWorkflow()">刷新快照 / 生成报告</button><button class="warn" onclick="runChecks()">运行已配置检查</button></div></header>
<main class="wrap"><div id="message" class="notice">控制台仅运行于本机。</div><div class="grid">
<section class="card input"><h2>工作流与仓库</h2><div id="setup"></div><div class="row" style="margin-top:12px"><input id="repoUrl" type="text" placeholder="https://github.com/org/repository"><input id="repoBranch" type="text" placeholder="分支（可选）"><input id="repoPath" type="text" placeholder="仓库目录名（相对于工作区）"><button onclick="addRepo()">添加仓库</button></div><p class="dim">导入只接受 GitHub HTTPS；克隆在点击后执行，目标目录必须不存在。</p><div id="repos"></div></section>
<section class="card input"><h2>推断依赖审阅</h2><p class="dim">蓝色输入：归属设置与依赖关系。边可保留、删除或反向后再保存。</p><div id="edges"></div><button id="saveConfig" onclick="saveConfig()">保存已审阅配置</button></section>
<section class="card output"><h2>变更收件箱</h2><div id="cases" class="scroll"></div></section>
<section class="card output"><h2>快照、对比与验证</h2><div id="verification"></div><div class="toolbar"><button class="secondary" onclick="runChecks(true)">强制重新运行检查</button></div><p class="dim">检查只在点击“运行已配置检查”或“强制重新运行检查”后执行。普通运行会复用仍有效的证据，并列出需要重跑的项目。</p></section>
<section class="card output wide"><h2>当前工作流报告</h2><div class="toolbar"><a id="reportLink" target="_blank"></a><button class="secondary" onclick="document.getElementById('reportFrame').src='/report?view='+Date.now()">重新载入报告</button></div><iframe id="reportFrame" title="当前工作流报告"></iframe></section>
</div></main><script>
const csrf='__CSRF__';let state=null, draft=null;async function api(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Workflow-CSRF':csrf},body:JSON.stringify(body||{})});let x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);return x}function msg(s,err=false){let e=document.getElementById('message');e.textContent=s;e.className='notice'+(err?' error':'')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadState(){try{state=await(await fetch('/api/state')).json();document.getElementById('root').textContent=state.root;renderState();if(!state.initialized) await discover()}catch(e){msg(e.message,true)}}async function discover(){try{draft=await(await fetch('/api/discover')).json();drawConfig()}catch(e){msg(e.message,true)}}
function renderState(){let s=document.getElementById('setup');s.innerHTML=state.initialized?'<p>配置已保存。修改归属或依赖后点击保存。</p>':'<p><b>尚未初始化。</b>正在展示本地发现结果；检查推断边并编辑归属后保存。</p><button onclick="discover()">重新发现</button>';if(state.config){draft=structuredClone(state.config);drawConfig()}renderCases();renderVerification();let link=document.getElementById('reportLink');if(state.report_url){link.href='/report';link.textContent='在新标签页查看完整报告';document.getElementById('reportFrame').src='/report'}else{link.textContent='尚无报告；刷新快照后生成'} }
function drawConfig(){if(!draft)return;document.getElementById('repos').innerHTML=draft.nodes.map((n,i)=>{let r=draft.repositories.find(x=>x.id===n.repository);return `<div class="repo"><strong>${esc(n.label||n.id)}</strong><div class="dim">${esc(r?.path||n.repository)} · ${esc(n.id)}</div><label>负责人 / Owner</label><input type="text" value="${esc(n.owner||'unassigned')}" data-owner-index="${i}"></div>`}).join('');document.getElementById('edges').innerHTML=draft.edges.length?draft.edges.map((e,i)=>`<div class="edge"><span><b>${esc(e.from)}</b> → <b>${esc(e.to)}</b><small class="dim"><br>${esc(e.basis||'declared')} · ${esc(e.reason||'')}</small></span><button data-edge-index="${i}" data-edge-action="keep">保留</button><button class="secondary" data-edge-index="${i}" data-edge-action="reverse">反向</button><button class="secondary" data-edge-index="${i}" data-edge-action="remove">删除</button></div>`).join(''):'<p>没有推断依赖边。可直接保存配置。</p>'}
function setOwner(i,v){let n=draft.nodes[i];if(n)n.owner=v.trim()||'unassigned'}function edgeAction(i,action){let e=draft.edges[i];if(action==='remove')draft.edges.splice(i,1);if(action==='reverse')[e.from,e.to]=[e.to,e.from];if(action==='keep')e.basis='reviewed: '+(e.basis||'inferred');drawConfig()}
async function saveConfig(){try{let x=await api('/api/config',{config:draft});state.config=x.config;state.initialized=true;msg('配置已验证并保存。新配置使用独立基线，不代表兼容性结论。');await loadState()}catch(e){msg(e.message,true)}}
async function addRepo(){try{let data={url:document.getElementById('repoUrl').value,branch:document.getElementById('repoBranch').value,path:document.getElementById('repoPath').value};let x=await api('/api/import',data);msg('仓库已克隆到 '+x.path+'。现在重新发现并审阅后保存配置。');await discover()}catch(e){msg(e.message,true)}}
async function refreshWorkflow(){try{let x=await api('/api/refresh');state.snapshot=x.snapshot;state.report=x.report;state.report_url=x.report_url;let latest=await(await fetch('/api/state')).json();state.cases=latest.cases;renderState();msg(x.baseline_reset?'配置对应的新基线已建立；当前报告不提供跨配置兼容性结论。':'快照与对比报告已更新。')}catch(e){msg(e.message,true)}}
async function runChecks(force=false){try{msg('正在运行配置中明确声明的检查…');let x=await api('/api/check',{force});state.verification=x.verification;state.snapshot=x.snapshot;state.report=x.report;state.report_url=x.report_url;state.cases=x.cases;renderState();msg(x.plan)}catch(e){msg(e.message,true)}}function renderVerification(){let e=document.getElementById('verification'),v=state?.verification,decisions=state?.report?.revalidation||v?.revalidation||[];if(!v&&!decisions.length){e.innerHTML='<p>尚无检查结果。命令检查默认不运行。</p>';return}e.innerHTML=`<p><b>验证记录：${v?.records?.length||0}</b></p>${decisions.map(x=>`<div class="repo"><b>${esc(x.requirement)}</b> · 计划：${esc(x.action)}<div>${esc(x.reason)}${x.relevant_check_ids?.length?' · '+esc(x.relevant_check_ids.join(', ')):''}</div></div>`).join('')}${(v?.records||[]).map(x=>`<div class="repo"><b>${esc(x.requirement)}</b> · ${esc(state?.report?.requirements?.find(r=>r.id===x.requirement)?.state||x.result)}${x.evidence_reused?' · 沿用有效证据':''}<div>${esc(x.summary)}</div></div>`).join('')}<p class="dim">${state.snapshot?'快照：'+esc(state.snapshot.snapshot_id):''} · 上述状态按当前报告的依赖绑定判断；详情保留原始检查记录。</p>`}
function caseCard(c){let labels={open:'待处理',claimed:'已认领',resolved:'已解决',dismissed:'已排除'};return `<article class="case"><h3>${esc(c.node)} <span class="status">${labels[c.status]||esc(c.status)}</span></h3><p>影响：${esc(c.impact_status)} · 负责人：${esc(c.owner||'未分配')} · 快照：${esc(c.candidate_snapshot_id)}</p><p>路径：${(c.paths||[]).map(p=>esc((p.nodes||[]).join(' → '))).join('<br>')}</p><div class="row"><input data-actor="${esc(c.id)}" type="text" placeholder="操作人"><input data-note="${esc(c.id)}" type="text" placeholder="备注（关闭 case 必填）"><button data-case-id="${esc(c.id)}" data-case-status="claimed">领取</button><button data-case-id="${esc(c.id)}" data-case-status="resolved">解决</button><button class="secondary" data-case-id="${esc(c.id)}" data-case-status="dismissed">排除</button><button class="secondary" data-case-id="${esc(c.id)}" data-case-status="open">重新打开</button></div></article>`}function renderCases(){let el=document.getElementById('cases'),all=state?.cases?.cases||[],candidate=state?.report?.candidate?.id,items=candidate?all.filter(c=>c.candidate_snapshot_id===candidate):all,older=all.filter(c=>!candidate||c.candidate_snapshot_id!==candidate);el.innerHTML=items.length?items.map(caseCard).join(''):'<p>当前候选没有待处理 case。刷新快照会同步当前报告中的影响项。</p>';if(older.length)el.innerHTML+=`<details><summary>较早候选记录（${older.length}）</summary>${older.map(caseCard).join('')}</details>`}
async function caseUpdate(id,status,actor,note){try{let result=await api('/api/case',{id,status,actor,note});state.cases=result;renderCases();document.getElementById('reportFrame').src='/report?view='+Date.now();msg('Case 状态已更新，报告已刷新。')}catch(e){msg(e.message,true)}}
document.addEventListener('change',e=>{if(e.target.matches('[data-owner-index]'))setOwner(Number(e.target.dataset.ownerIndex),e.target.value)});document.addEventListener('click',e=>{let b=e.target.closest('[data-edge-index]');if(b)edgeAction(Number(b.dataset.edgeIndex),b.dataset.edgeAction);let c=e.target.closest('[data-case-id]');if(c){let id=c.dataset.caseId;caseUpdate(id,c.dataset.caseStatus,document.querySelector(`[data-actor="${CSS.escape(id)}"]`).value,document.querySelector(`[data-note="${CSS.escape(id)}"]`).value)}});loadState();
</script></body></html>
