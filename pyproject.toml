[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-workflow-impact"
version = "0.5.0"
description = "Versioned engineering workflows and evidence-backed cross-repository change impact"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Robot Workflow contributors"}]
dependencies = []

[project.scripts]
robot-workflow = "robot_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_workflow = ["*.html"]
